name: Cleanup merged trend research branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged branch and remove cleanup workflow
        run: |
          git push origin --delete research/bull-put-trend-regime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-merged-research-branch.yml
          git commit -m "chore: remove branch cleanup workflow"
          git push origin HEAD:main
