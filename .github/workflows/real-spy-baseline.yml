name: Real SPY 2020-2025 Baseline

on:
  pull_request:
    paths:
      - scripts/real_spy_baseline.py
      - .github/workflows/real-spy-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-spy-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CondorPilot and research dependency
        run: |
          python -m pip install -e .
          python -m pip install 'duckdb>=1.3,<2'
      - name: Download real SPY option history
        run: |
          mkdir -p /tmp/spy-real
          for year in 2020 2021 2022 2023 2024 2025; do
            echo "Downloading SPY options ${year}"
            curl -L --fail --retry 4 --retry-delay 2 \
              -o "/tmp/spy-real/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/spy-real/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/underlying_prices.parquet"
          ls -lh /tmp/spy-real
          du -sh /tmp/spy-real
      - name: Run frozen CondorPilot baseline on real data
        run: |
          python scripts/real_spy_baseline.py \
            --data-dir /tmp/spy-real \
            --start 2020-01-02 \
            --end 2025-12-16 \
            --output /tmp/real-spy-baseline.json
      - name: Inspect first real-data continuity failure
        if: failure()
        run: |
          python - <<'PY'
          import duckdb

          con = duckdb.connect()
          rows = con.execute(
              """
              SELECT contract_id, date, expiration, strike, type, last, mark,
                     bid, ask, volume, open_interest, implied_volatility, delta
              FROM read_parquet('/tmp/spy-real/options_2020.parquet')
              WHERE CAST(date AS DATE) BETWEEN DATE '2020-06-18' AND DATE '2020-06-26'
                AND CAST(expiration AS DATE) = DATE '2020-07-24'
                AND CAST(strike AS DOUBLE) = 280
                AND lower(CAST(type AS VARCHAR)) = 'put'
              ORDER BY date
              """
          ).fetchall()
          print('SURROUNDING_HELD_LEG_ROWS=', rows)
          PY
      - name: Show result JSON
        if: always()
        run: |
          if [ -f /tmp/real-spy-baseline.json ]; then
            cat /tmp/real-spy-baseline.json
          fi
      - name: Upload real-data evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-spy-2020-2025-baseline
          path: /tmp/real-spy-baseline.json
          if-no-files-found: warn
