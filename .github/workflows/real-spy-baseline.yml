name: Real SPY Historical Validation

on:
  pull_request:
    paths:
      - scripts/real_spy_baseline.py
      - scripts/real_spy_sensitivity.py
      - scripts/real_spy_iv_regime.py
      - .github/workflows/real-spy-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-spy-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CondorPilot and research dependency
        run: |
          python -m pip install -e .
          python -m pip install 'duckdb>=1.3,<2'
      - name: Download real SPY option history
        run: |
          mkdir -p /tmp/spy-real
          for year in 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025; do
            echo "Downloading SPY options ${year}"
            curl -L --fail --retry 4 --retry-delay 2 \
              -o "/tmp/spy-real/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/spy-real/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/underlying_prices.parquet"
          ls -lh /tmp/spy-real
          du -sh /tmp/spy-real
      - name: Run frozen 2020-2025 baseline
        run: |
          python scripts/real_spy_baseline.py \
            --data-dir /tmp/spy-real \
            --start 2020-01-02 \
            --end 2025-12-12 \
            --output /tmp/real-spy-baseline.json
      - name: Run predeclared sensitivity and temporal validation
        run: |
          PYTHONPATH=. python scripts/real_spy_sensitivity.py \
            --data-dir /tmp/spy-real \
            --output /tmp/real-spy-sensitivity.json
      - name: Run no-lookahead IV regime validation
        run: |
          PYTHONPATH=. python scripts/real_spy_iv_regime.py \
            --data-dir /tmp/spy-real \
            --output /tmp/real-spy-iv-regime.json
      - name: Show compact research result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path('/tmp/real-spy-baseline.json'),
              Path('/tmp/real-spy-sensitivity.json'),
              Path('/tmp/real-spy-iv-regime.json'),
          ):
              if not path.exists():
                  continue
              payload = json.loads(path.read_text())
              print(f'=== {path.name} ===')
              if 'performance' in payload:
                  print(json.dumps({
                      'performance': payload['performance'],
                      'benchmarks': payload['benchmarks'],
                      'stale_marks': {
                          'legs': payload['dataset']['stale_mark_leg_count'],
                          'days': payload['dataset']['stale_mark_day_count'],
                      },
                  }, indent=2, sort_keys=True))
              else:
                  print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Upload real-data research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-spy-historical-validation
          path: |
            /tmp/real-spy-baseline.json
            /tmp/real-spy-sensitivity.json
            /tmp/real-spy-iv-regime.json
          if-no-files-found: warn
