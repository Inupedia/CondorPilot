name: Real SPY Bull Put Deterioration Diagnostics

on:
  pull_request:
    paths:
      - "scripts/real_spy_put_diagnostics.py"
      - "scripts/real_spy_put_trend.py"
      - "scripts/real_spy_put_premium.py"
      - "scripts/real_spy_side_attribution.py"
      - "scripts/real_spy_baseline.py"
      - ".github/workflows/real-spy-put-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CondorPilot and research dependency
        run: |
          python -m pip install -e .
          python -m pip install 'duckdb>=1.3,<2'
      - name: Download real SPY option history
        run: |
          mkdir -p /tmp/spy-put-diagnostics
          for year in 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025; do
            echo "Downloading SPY options ${year}"
            curl -L --fail --retry 4 --retry-delay 2 \
              -o "/tmp/spy-put-diagnostics/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/spy-put-diagnostics/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/underlying_prices.parquet"
          du -sh /tmp/spy-put-diagnostics
      - name: Run frozen-trade deterioration diagnostics
        run: |
          PYTHONPATH=. python scripts/real_spy_put_diagnostics.py \
            --data-dir /tmp/spy-put-diagnostics \
            --output /tmp/real-spy-put-diagnostics.json
      - name: Show diagnostic result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/real-spy-put-diagnostics.json').read_text())
          print(json.dumps({
              'stage_summaries': payload['stage_summaries'],
              'winner_loser_feature_comparison': payload['winner_loser_feature_comparison']['2020_2025'],
              'worst_2020_2025_trades': payload['worst_2020_2025_trades'][:10],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-spy-put-diagnostics
          path: /tmp/real-spy-put-diagnostics.json
