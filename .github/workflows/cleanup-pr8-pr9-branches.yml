name: Cleanup evidence branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete closed evidence branches
        run: |
          for branch in feat/real-spy-evidence-run feat/real-evidence-pipeline; do
            if git ls-remote --exit-code --heads origin "$branch"; then
              git push origin --delete "$branch"
            fi
          done
