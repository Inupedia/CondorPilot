name: Cleanup merged PR branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged branch
        run: |
          if git ls-remote --exit-code --heads origin fix/research-integrity-hardening; then
            git push origin --delete fix/research-integrity-hardening
          fi
