name: Real SPY Side Attribution

on:
  pull_request:
    paths:
      - scripts/real_spy_side_attribution.py
      - .github/workflows/real-spy-side-attribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  side-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CondorPilot and research dependency
        run: |
          python -m pip install -e .
          python -m pip install 'duckdb>=1.3,<2'
      - name: Download real SPY option history
        run: |
          mkdir -p /tmp/spy-side
          for year in 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025; do
            echo "Downloading SPY options ${year}"
            curl -L --fail --retry 4 --retry-delay 2 \
              -o "/tmp/spy-side/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/spy-side/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/underlying_prices.parquet"
          du -sh /tmp/spy-side
      - name: Run exact attribution and standalone spread study
        run: |
          PYTHONPATH=. python scripts/real_spy_side_attribution.py \
            --data-dir /tmp/spy-side \
            --output /tmp/real-spy-side-attribution.json
      - name: Show compact result
        if: always()
        run: |
          if [ -f /tmp/real-spy-side-attribution.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/real-spy-side-attribution.json').read_text())
          print(json.dumps({
              'attribution': payload['condor_attribution_2020_2025'],
              'discovery': payload['standalone_discovery'],
              'validation': payload['standalone_validation'],
              'external_holdout_candidates': payload['external_holdout_candidates'],
          }, indent=2, sort_keys=True))
          PY
          fi
      - name: Upload side-attribution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-spy-side-attribution
          path: /tmp/real-spy-side-attribution.json
          if-no-files-found: warn
