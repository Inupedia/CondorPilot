name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke test strategy CLI
        run: condorpilot demo --spot 100 --iv 0.25 --strike-increment 1 --min-credit-to-width 0
      - name: Smoke test backtester CLI
        run: >-
          condorpilot backtest-demo --spot 100 --days 30 --iv 0.25
          --strike-increment 1 --min-credit-to-width 0
      - name: Smoke test research CLI
        run: >-
          condorpilot research --spot 100 --days 30 --iv 0.25 --strike-increment 1
          --dtes 30,45 --deltas 0.10,0.15 --exit-dtes 14 --min-credit-to-width 0 --top 3
          --allowed-regimes normal --iv-lookback 10
      - name: Smoke test volatility regimes CLI
        run: >-
          condorpilot regimes --spot 100 --days 10 --iv 0.25
          --strike-increment 1 --iv-lookback 10 --tail 3
      - name: Smoke test evidence CLI surface
        run: condorpilot evidence --help
      - name: Smoke test evidence CLI with persisted CSV
        run: |
          python - <<'PY'
          from datetime import UTC, datetime

          from condorpilot.history import OptionChainSnapshot, build_synthetic_history
          from condorpilot.importers import save_option_chain_csv

          generated = build_synthetic_history(
              symbol="SPY",
              start=datetime(2025, 1, 6, 21, 0, tzinfo=UTC),
              spots=[100 + i * 0.03 for i in range(210)],
              volatility=0.25,
              target_dte=45,
              expiration_interval_days=7,
              strike_increment=1,
              spread=0,
          )
          cleaned = []
          for snapshot in generated:
              if snapshot.as_of.weekday() >= 5:
                  continue
              quotes = tuple(
                  quote
                  for quote in snapshot.quotes
                  if 20 <= (quote.expiration - snapshot.as_of).days <= 75
                  and quote.mid > 0
              )
              cleaned.append(
                  OptionChainSnapshot(
                      observed_at=snapshot.observed_at,
                      spot=snapshot.spot,
                      quotes=quotes,
                  )
              )
          save_option_chain_csv(tuple(cleaned), "/tmp/spy-evidence.csv")
          PY
          condorpilot evidence \
            --csv /tmp/spy-evidence.csv \
            --output-json /tmp/evidence.json \
            --dtes 45 --deltas 0.15 --wing-widths 5 \
            --profit-targets 0.50 --stop-multiples 2 \
            --exit-dtes 21 --risk-fractions 0.01 \
            --train-size 60 --test-size 30 --step-size 30 \
            --min-train-trades 1 --minimum-oos-folds 1 \
            --minimum-oos-trades 1 --minimum-tested-fraction 0 \
            --minimum-known-regime-fraction 0 \
            --minimum-selection-stability 0 \
            --minimum-oos-return -10 --maximum-oos-drawdown 1 \
            --minimum-profitable-fold-fraction 0 \
            --min-credit-to-width 0 --slippage 0 --commission 0 \
            --iv-lookback 20 --target-iv-dte 45
          python - <<'PY'
          import json

          with open("/tmp/evidence.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert len(payload["experiment_fingerprint"]) == 64
          assert len(payload["dataset_fingerprint"]) == 64
          assert payload["live_trading_approved"] is False
          assert "profit_factor" in payload["oos"]
          PY
      - name: Smoke test dataset diagnostics API
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from condorpilot import diagnose_dataset
          from condorpilot.history import build_synthetic_history

          history = build_synthetic_history(
              symbol="SPY",
              start=datetime(2026, 1, 5, 21, 0, tzinfo=UTC),
              spots=[100 + i * 0.05 for i in range(10)],
              volatility=0.25,
              target_dte=45,
              expiration_interval_days=7,
              strike_increment=1,
              spread=0.02,
          )
          report = diagnose_dataset(history)
          assert len(report.fingerprint) == 64
          assert report.dte_coverage > 0
          assert report.executable_coverage > 0
          PY
      - name: Smoke test walk-forward validation API
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from condorpilot import BacktestConfig, ParameterGrid, StrategyConfig
          from condorpilot import WalkForwardConfig, run_walk_forward
          from condorpilot.execution import ExecutionConfig
          from condorpilot.history import build_synthetic_history

          history = build_synthetic_history(
              symbol="SPY",
              start=datetime(2026, 1, 5, 21, 0, tzinfo=UTC),
              spots=[100 + i * 0.08 for i in range(50)],
              volatility=0.25,
              target_dte=10,
              expiration_interval_days=7,
              strike_increment=1,
              spread=0.02,
          )
          base = BacktestConfig(
              strategy=StrategyConfig(
                  target_dte=10,
                  max_dte_deviation_days=4,
                  short_delta=0.15,
                  max_delta_deviation=0.08,
                  wing_width=5,
                  max_bid_ask_spread_fraction=1,
                  exit_dte=3,
                  min_credit_to_width=0,
              ),
              execution=ExecutionConfig(
                  slippage_fraction=0,
                  commission_per_contract_per_leg=0,
              ),
          )
          result = run_walk_forward(
              history,
              grid=ParameterGrid(
                  target_dte=(10,),
                  short_delta=(0.10, 0.15),
                  wing_width=(5.0,),
                  profit_target_fraction=(0.50,),
                  stop_loss_credit_multiple=(2.0,),
                  exit_dte=(3,),
                  max_risk_fraction=(0.01,),
              ),
              base_config=base,
              config=WalkForwardConfig(
                  train_size=25,
                  test_size=10,
                  step_size=10,
                  min_train_trades=1,
                  require_dataset_pass=False,
              ),
          )
          assert len(result.folds) >= 1
          assert len(result.dataset.fingerprint) == 64
          PY
      - name: Smoke test evidence API
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from condorpilot import (
              BacktestConfig,
              DiagnosticThresholds,
              EvidenceThresholds,
              ParameterGrid,
              StrategyConfig,
              WalkForwardConfig,
              run_evidence,
          )
          from condorpilot.execution import ExecutionConfig
          from condorpilot.history import build_synthetic_history

          history = build_synthetic_history(
              symbol="SPY",
              start=datetime(2026, 1, 5, 21, 0, tzinfo=UTC),
              spots=[100 + i * 0.08 for i in range(60)],
              volatility=0.25,
              target_dte=10,
              expiration_interval_days=7,
              strike_increment=1,
              spread=0.02,
          )
          base = BacktestConfig(
              strategy=StrategyConfig(
                  target_dte=10,
                  max_dte_deviation_days=4,
                  short_delta=0.15,
                  max_delta_deviation=0.08,
                  wing_width=5,
                  max_bid_ask_spread_fraction=1,
                  exit_dte=3,
                  min_credit_to_width=0,
              ),
              execution=ExecutionConfig(
                  slippage_fraction=0,
                  commission_per_contract_per_leg=0,
              ),
          )
          grid = ParameterGrid(
              target_dte=(10,),
              short_delta=(0.10, 0.15),
              wing_width=(5.0,),
              profit_target_fraction=(0.50,),
              stop_loss_credit_multiple=(2.0,),
              exit_dte=(3,),
              max_risk_fraction=(0.01,),
          )
          diagnostics = DiagnosticThresholds(
              minimum_weekday_coverage=0,
              maximum_weekend_fraction=1,
              maximum_missing_iv_fraction=1,
              maximum_wide_quote_fraction=1,
              minimum_contract_continuity=0,
              minimum_dte_coverage=0,
              minimum_delta_coverage=0,
              minimum_wing_coverage=0,
              minimum_executable_coverage=0,
          )
          evidence = EvidenceThresholds(
              minimum_oos_folds=1,
              minimum_oos_trades=1,
              minimum_tested_snapshot_fraction=0,
              minimum_known_regime_trade_fraction=0,
              minimum_selection_stability=0,
              minimum_oos_total_return=-10,
              maximum_oos_drawdown=1,
              minimum_profitable_fold_fraction=0,
              minimum_oos_profit_factor=0,
          )
          result = run_evidence(
              history,
              grid=grid,
              base_config=base,
              walk_forward_config=WalkForwardConfig(
                  train_size=30,
                  test_size=15,
                  step_size=15,
                  min_train_trades=1,
              ),
              diagnostic_thresholds=diagnostics,
              evidence_thresholds=evidence,
              iv_lookback=20,
              target_iv_dte=10,
          )
          assert len(result.experiment_fingerprint) == 64
          assert result.live_trading_approved is False
          PY
      - name: Smoke test paper trading safety core
        run: |
          python - <<'PY'
          from datetime import date

          from condorpilot import (
              AccountSnapshot,
              ComboLeg,
              NetPriceEffect,
              OptionContract,
              OptionType,
              OrderSide,
              PaperOrderIntent,
              evaluate_order_risk,
          )

          expiration = date(2026, 10, 16)
          intent = PaperOrderIntent(
              idempotency_key="ci-paper-order",
              legs=(
                  ComboLeg(OptionContract("SPY", expiration, 590, OptionType.PUT), OrderSide.BUY),
                  ComboLeg(OptionContract("SPY", expiration, 595, OptionType.PUT), OrderSide.SELL),
                  ComboLeg(OptionContract("SPY", expiration, 690, OptionType.CALL), OrderSide.SELL),
                  ComboLeg(OptionContract("SPY", expiration, 695, OptionType.CALL), OrderSide.BUY),
              ),
              quantity=1,
              limit_price=1.0,
              price_effect=NetPriceEffect.CREDIT,
              max_loss_per_combo=400,
          )
          decision = evaluate_order_risk(intent, AccountSnapshot(equity=50_000))
          assert decision.allowed
          assert len(intent.fingerprint) == 64
          PY
