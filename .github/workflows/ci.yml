name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke test strategy CLI
        run: condorpilot demo --spot 100 --iv 0.25 --strike-increment 5 --min-credit-to-width 0
      - name: Smoke test backtester CLI
        run: >-
          condorpilot backtest-demo --spot 100 --days 30 --iv 0.25
          --strike-increment 5 --min-credit-to-width 0
      - name: Smoke test research CLI
        run: >-
          condorpilot research --spot 100 --days 30 --iv 0.25 --dtes 30,45
          --deltas 0.10,0.15 --exit-dtes 14 --min-credit-to-width 0 --top 3
