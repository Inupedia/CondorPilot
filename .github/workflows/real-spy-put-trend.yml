name: Real SPY Bull Put Trend Study

on:
  pull_request:
    paths:
      - "scripts/real_spy_put_trend.py"
      - "scripts/real_spy_put_premium.py"
      - "scripts/real_spy_side_attribution.py"
      - "scripts/real_spy_baseline.py"
      - ".github/workflows/real-spy-put-trend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  put-trend-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CondorPilot and research dependency
        run: |
          python -m pip install -e .
          python -m pip install 'duckdb>=1.3,<2'
      - name: Download real SPY option history
        run: |
          mkdir -p /tmp/spy-put-trend
          for year in 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025; do
            echo "Downloading SPY options ${year}"
            curl -L --fail --retry 4 --retry-delay 2 \
              -o "/tmp/spy-put-trend/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/spy-put-trend/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/underlying_prices.parquet"
          du -sh /tmp/spy-put-trend
      - name: Run predeclared Bull Put trend study
        run: |
          PYTHONPATH=. python scripts/real_spy_put_trend.py \
            --data-dir /tmp/spy-put-trend \
            --output /tmp/real-spy-put-trend.json
      - name: Show compact research result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/real-spy-put-trend.json').read_text())
          print(json.dumps({
              'discovery': payload['discovery_2011_2015'],
              'stage1': payload['temporal_stage1_2016_2019'],
              'stage2': payload['temporal_stage2_2020_2025'],
              'qqq_external_holdout_ready': payload['qqq_external_holdout_ready'],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload Bull Put trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-spy-put-trend
          path: /tmp/real-spy-put-trend.json
