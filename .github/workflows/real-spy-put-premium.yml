name: Real SPY Bull Put Premium Study

on:
  pull_request:
    paths:
      - "scripts/real_spy_put_premium.py"
      - "scripts/real_spy_side_attribution.py"
      - "scripts/real_spy_baseline.py"
      - ".github/workflows/real-spy-put-premium.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  put-premium-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CondorPilot and research dependency
        run: |
          python -m pip install -e .
          python -m pip install 'duckdb>=1.3,<2'
      - name: Download real SPY option history
        run: |
          mkdir -p /tmp/spy-put-premium
          for year in 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025; do
            echo "Downloading SPY options ${year}"
            curl -L --fail --retry 4 --retry-delay 2 \
              -o "/tmp/spy-put-premium/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/spy-put-premium/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/underlying_prices.parquet"
          du -sh /tmp/spy-put-premium
      - name: Run predeclared Bull Put premium study
        run: |
          PYTHONPATH=. python scripts/real_spy_put_premium.py \
            --data-dir /tmp/spy-put-premium \
            --output /tmp/real-spy-put-premium.json
      - name: Show compact research result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/real-spy-put-premium.json').read_text())
          compact = {
              'discovery': payload['discovery'],
              'selected_rule': payload['selected_rule'],
              'validation': payload['validation'],
              'qqq_external_holdout_ready': payload['qqq_external_holdout_ready'],
          }
          print(json.dumps(compact, indent=2, sort_keys=True))
          PY
      - name: Upload Bull Put premium artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-spy-put-premium
          path: /tmp/real-spy-put-premium.json
